name: Build DuoSolo dylib
on:
  push:
    branches:
      - duosolo-ytplus-build-20261113
    paths:
      - "duosolo/src/**"
      - "duosolo/build.sh"
      - ".github/workflows/duosolo-build.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  ios-dylib:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: duosolo-ytplus-build-20261113
      - name: Build iOS arm64 dylib
        run: bash duosolo/build.sh
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DuoSoloSettings-arm64
          path: duosolo/output/DuoSoloSettings.dylib
      - name: Commit compressed artifact chunks
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import gzip,base64,hashlib
          raw=Path('duosolo/output/DuoSoloSettings.dylib').read_bytes()
          data=base64.b64encode(gzip.compress(raw,compresslevel=9)).decode()
          out=Path('duosolo/output-b64')
          out.mkdir(parents=True,exist_ok=True)
          for n in out.glob('*.txt'): n.unlink()
          for i in range(0,len(data),5000):
              (out/f'{i//5000:03d}.txt').write_text(data[i:i+5000])
          (out/'manifest.txt').write_text(f"bytes={len(raw)}\nsha256={hashlib.sha256(raw).hexdigest()}\nchunks={(len(data)+4999)//5000}\n")
          PY
          git config user.name "DuoSolo CI"
          git config user.email "actions@users.noreply.github.com"
          git add duosolo/output-b64/
          git commit -m "CI: DuoSoloSettings dylib build output [skip ci]"
          git push origin HEAD:duosolo-ytplus-build-20261113
